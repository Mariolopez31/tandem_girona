ekf_aruco:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    publish_tf: true 
    publish_acceleration: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: blueboat/base_link_enu
    world_frame: map

    odom0: /Odometry
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # INPUT 0 — ArUco absolute pose
    pose0: /blueboat/navigator/aruco_pose
    pose0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 20
    pose0_rejection_threshold: 2.0



